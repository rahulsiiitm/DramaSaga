<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MicroDrama storyboard</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 Arial,sans-serif;color:#251f21;background:#f4efec;margin:0}main{max-width:1100px;margin:auto;padding:24px}h1,h2{font-family:Georgia,serif}section{background:white;padding:20px;margin:16px 0}button,select,input{font:inherit;padding:8px}button{background:#73a89a;border:0;margin-right:8px;cursor:pointer}#layout{display:grid;grid-template-columns:minmax(200px,360px) 1fr;gap:24px}#picture{width:100%;aspect-ratio:9/16;object-fit:contain;background:#282327}#missing{padding:40px;background:#e5dcd6}#seek{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}li{margin-bottom:10px}.notice{background:#e5dcd6;padding:12px}#shots{display:flex;gap:8px;overflow-x:auto}#shots button{min-width:110px}audio{width:100%}[hidden]{display:none!important}@media(max-width:640px){#layout{grid-template-columns:1fr}#picture{max-height:60vh}}
</style>
<main><h1 id="title">Storyboard</h1><p class="notice">Storyboard preview. Missing images remain visible as missing. Still images do not demonstrate acting or lip sync.</p>
<label for="episode">Episode</label> <select id="episode"></select>
<section><p id="timing"></p><button id="play">Play</button><button id="pause">Pause</button><label for="seek">Timeline</label><input id="seek" type="range" min="0" value="0" step="0.04"><span id="clock"></span><audio id="audio" controls hidden></audio></section>
<section id="layout"><div><img id="picture" alt="Shot reference" hidden><p id="missing">Reference image missing</p></div><div><h2 id="shot"></h2><p id="purpose"></p><p id="camera"></p><p id="action"></p><ul id="lines"></ul><details><summary>Continuity state</summary><pre id="state"></pre></details></div></section><section id="shots" aria-label="Shots"></section></main>
<script>
const story=/*STORY_DATA*/;
const $=id=>document.getElementById(id);let episode=story.episodes[0],time=0,playing=false,last=0;
$('title').textContent=story.series_id+' — storyboard';
story.episodes.forEach((ep,i)=>{let o=document.createElement('option');o.value=i;o.textContent=ep.id+' · '+ep.title;$('episode').append(o)});
function draw(){let shot=episode.shots.find(s=>s.start<=time&&time<s.end)||episode.shots.at(-1);$('seek').value=time;$('clock').textContent=time.toFixed(1)+' / '+episode.duration.toFixed(1)+'s';$('shot').textContent=shot.id;$('purpose').textContent=shot.purpose;$('camera').textContent=shot.camera;$('action').textContent=shot.action;$('picture').hidden=!shot.image;$('missing').hidden=!!shot.image;if(shot.image)$('picture').src=shot.image;else $('picture').removeAttribute('src');$('lines').replaceChildren();shot.lines.forEach(l=>{let li=document.createElement('li');li.textContent=l.speaker+': '+l.text+' ('+l.performance+')';$('lines').append(li)});$('state').textContent=JSON.stringify({start:shot.start_state,end:shot.end_state},null,2)}
function choose(){playing=false;$('audio').pause();episode=story.episodes[Number($('episode').value)];time=0;$('seek').max=episode.duration;$('timing').textContent=episode.timing;$('audio').hidden=!episode.audio;if(episode.audio)$('audio').src=episode.audio;else $('audio').removeAttribute('src');$('shots').replaceChildren();episode.shots.forEach(s=>{let b=document.createElement('button');b.textContent=s.id;b.onclick=()=>{time=s.start;if(episode.audio)$('audio').currentTime=time;draw()};$('shots').append(b)});draw()}
$('episode').onchange=choose;$('play').onclick=async()=>{if(time>=episode.duration){time=0;if(episode.audio)$('audio').currentTime=0}if(episode.audio){try{await $('audio').play()}catch(e){$('timing').textContent='Audio unavailable: '+e.message;return}}playing=true;last=performance.now()};$('pause').onclick=()=>{playing=false;$('audio').pause()};$('seek').oninput=()=>{time=Number($('seek').value);if(episode.audio)$('audio').currentTime=time;draw()};$('audio').onplay=()=>{playing=true};$('audio').onpause=()=>{playing=false};$('audio').ontimeupdate=()=>{time=$('audio').currentTime;draw()};
function tick(now){if(playing){time=episode.audio?$('audio').currentTime:Math.min(episode.duration,time+(now-last)/1000);if(time>=episode.duration){playing=false;$('audio').pause()}draw()}last=now;requestAnimationFrame(tick)}choose();requestAnimationFrame(tick);
</script></html>
